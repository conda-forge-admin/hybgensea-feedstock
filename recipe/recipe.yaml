context:
  name: hybgensea
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/hybgensea-${{ version }}.tar.gz
    sha256: 7e114d5890e42967078e936c45869fd9dd9d4d0dcf52c012b3258680537d2b85
  - url: https://github.com/mdealencar/HGS-CVRP/archive/f60dd6108fcaf9e4516ecb288edaf41bdf6bd809.tar.gz
    sha256: 0aff5a49b6281d71292b243238c5b80bbe82934566f41ccc3b262413e1225f5c
    target_directory: HGS-CVRP

build:
  number: 1
  skip:
    - match(python, "<3.10")
  script:
    - if: unix
      then:
        - python -m pip install . -vv --no-deps --no-build-isolation -C cmake.define.FETCHCONTENT_SOURCE_DIR_HGSCVRP="${SRC_DIR}/HGS-CVRP"
    - if: win
      then:
        - python -m pip install . -vv --no-deps --no-build-isolation -C cmake.define.FETCHCONTENT_SOURCE_DIR_HGSCVRP="%SRC_DIR%\HGS-CVRP"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then: make
  host:
    - python
    - scikit-build-core
    - nanobind
    - pip
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - hybgensea
      pip_check: true
  - requirements:
      run:
        - pytest
    script:
      - pytest --pyargs hybgensea.tests

about:
  homepage: https://github.com/mdealencar/HybGenSea
  repository: https://github.com/mdealencar/HybGenSea
  summary: Wrapper for the Hybrid Genetic Search algorithm for Capacitated Vehicle Routing Problems (HGS-CVRP)
  license: MIT
  license_file:
    - LICENSE
    - HGS-CVRP/LICENSE

extra:
  recipe-maintainers:
    - mdealencar
    - simutisernestas
